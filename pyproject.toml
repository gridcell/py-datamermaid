[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datamermaid"
version = "0.1.0"
description = "Python client for the MERMAID coral reef monitoring API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dustin Sampson", email = "dustin@sparkgeo.com" }]
keywords = ["mermaid", "coral", "reef", "api", "datamermaid"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = ["httpx>=0.24", "pandas>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "respx>=0.20", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/gridcell/py-datamermaid"
Source = "https://github.com/gridcell/py-datamermaid"
"MERMAID API" = "https://api.datamermaid.org/v1/"

[tool.hatch.build.targets.wheel]
packages = ["src/datamermaid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.isort]
known-first-party = ["datamermaid"]
