[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datamermaid"
version = "0.2.0"
description = "Python client for the MERMAID coral reef monitoring API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Dustin Sampson", email = "dustin@sparkgeo.com" }]
maintainers = [{ name = "Dustin Sampson", email = "dustin@sparkgeo.com" }]
keywords = ["mermaid", "mermaidr", "coral", "reef", "marine", "ecology", "api", "datamermaid"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24", "pandas>=1.5"]

[project.optional-dependencies]
# marimo is here as well as in `notebook` below: `uv sync --extra dev` is the
# documented setup path, and without it `uv run examples/09_marimo_notebook.py`
# fails on the import rather than serving the notebook.
dev = ["pytest>=7.0", "respx>=0.20", "ruff>=0.5", "marimo>=0.13.15", "openpyxl>=3.1"]
# `get_gfcr_report()` parses the Excel workbook MERMAID generates, which
# pandas can only read through openpyxl.  It stays out of `dependencies` so the
# runtime requirements remain httpx and pandas; the function imports it lazily
# and points at this extra when it is missing.  It is in `dev` as well, because
# the offline tests build a workbook to answer the mocked request with.
excel = ["openpyxl>=3.1"]
# Only examples/09_marimo_notebook.py needs this; the library itself never
# imports marimo, and the test suite only parses that example.  0.13.15 is the
# oldest release the notebook has been checked against: it serves itself there
# through `marimo.create_asgi_app(include_code=False)`, and it stands down
# cleanly on the `mo.stop()` covering "no token yet", which earlier marimos get
# wrong -- up to 0.12 that escapes as a MarimoStopError traceback, and through
# 0.13.0 the stopped cell's dependants run anyway.
notebook = ["marimo>=0.13.15"]
# The documentation site (mkdocs.yml, docs/).  Deliberately outside `dev`: the
# test suite never imports mkdocs, and keeping it separate leaves the offline
# Python matrix free of a dependency tree it has no use for.  mkdocstrings
# renders the numpy-style docstrings the package already carries, so the API
# reference is generated rather than written.  mkdocs is capped below 2.0,
# which drops the plugin system this configuration is built on; ruff is here
# only because mkdocstrings uses it to format the signatures it renders.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/gridcell/py-datamermaid"
Documentation = "https://gridcell.github.io/py-datamermaid/"
Source = "https://github.com/gridcell/py-datamermaid"
Issues = "https://github.com/gridcell/py-datamermaid/issues"
Changelog = "https://github.com/gridcell/py-datamermaid/blob/main/CHANGELOG.md"
"MERMAID" = "https://datamermaid.org"
"MERMAID API" = "https://api.datamermaid.org/v1/"
"mermaidr (R)" = "https://github.com/data-mermaid/mermaidr"

[tool.hatch.build.targets.wheel]
packages = ["src/datamermaid"]

[tool.uv]
# `uv sync` installs datamermaid itself, editable, alongside its dependencies,
# so `uv run pytest` sees the checkout rather than a release from PyPI.  The dev
# extra above stays the single list of development dependencies; drive it with
# `uv sync --extra dev` rather than duplicating it into a dependency group.
package = true

[tool.pytest.ini_options]
testpaths = ["tests", "src/datamermaid"]
addopts = "-ra --strict-markers --doctest-modules"

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.isort]
known-first-party = ["datamermaid"]
