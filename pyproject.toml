[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datamermaid"
version = "0.1.0"
description = "Python client for the MERMAID coral reef monitoring API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Dustin Sampson", email = "dustin@sparkgeo.com" }]
maintainers = [{ name = "Dustin Sampson", email = "dustin@sparkgeo.com" }]
keywords = ["mermaid", "mermaidr", "coral", "reef", "marine", "ecology", "api", "datamermaid"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24", "pandas>=1.5"]

[project.optional-dependencies]
# marimo is here as well as in `notebook` below: `uv sync --extra dev` is the
# documented setup path, and without it `uv run examples/09_marimo_notebook.py`
# fails on the import rather than running the notebook as a script.
dev = ["pytest>=7.0", "respx>=0.20", "ruff>=0.5", "marimo>=0.13.15"]
# Only examples/09_marimo_notebook.py needs this; the library itself never
# imports marimo, and the test suite only parses that example.  The floor is
# what running that notebook as a plain script needs: earlier marimos mishandle
# the `mo.stop()` that stands in for "no token yet" -- up to 0.12 it escapes as
# a MarimoStopError traceback, and through 0.13.0 the stopped cell's dependants
# run anyway -- so an unauthenticated `python examples/09_marimo_notebook.py`
# failed instead of reporting that it found no token.
notebook = ["marimo>=0.13.15"]

[project.urls]
Homepage = "https://github.com/gridcell/py-datamermaid"
Documentation = "https://github.com/gridcell/py-datamermaid#readme"
Source = "https://github.com/gridcell/py-datamermaid"
Issues = "https://github.com/gridcell/py-datamermaid/issues"
"MERMAID" = "https://datamermaid.org"
"MERMAID API" = "https://api.datamermaid.org/v1/"
"mermaidr (R)" = "https://github.com/data-mermaid/mermaidr"

[tool.hatch.build.targets.wheel]
packages = ["src/datamermaid"]

[tool.uv]
# `uv sync` installs datamermaid itself, editable, alongside its dependencies,
# so `uv run pytest` sees the checkout rather than a release from PyPI.  The dev
# extra above stays the single list of development dependencies; drive it with
# `uv sync --extra dev` rather than duplicating it into a dependency group.
package = true

[tool.pytest.ini_options]
testpaths = ["tests", "src/datamermaid"]
addopts = "-ra --strict-markers --doctest-modules"

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.isort]
known-first-party = ["datamermaid"]
