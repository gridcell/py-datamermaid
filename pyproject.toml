[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datamermaid"
version = "0.1.0"
description = "Python client for the MERMAID coral reef monitoring API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dustin Sampson", email = "dustin@sparkgeo.com" }]
keywords = ["mermaid", "coral", "reef", "api", "datamermaid"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/gridcell/py-datamermaid"
Source = "https://github.com/gridcell/py-datamermaid"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/datamermaid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.coverage.run]
source = ["src/datamermaid"]
